name: Deploy to GitHub Pages

on:
  push:
    branches: [main]          # Only deploy from the protected main branch
  workflow_dispatch:          # Manual runs still allowed (useful after protection rules)

# Least-privilege defaults for the entire workflow
permissions:
  contents: read              # Never grant write at workflow level

concurrency:
  group: pages
  cancel-in-progress: false   # Do not cancel an in-progress production deploy

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write            # Needed to create the Pages artifact
      id-token: write         # Required for OIDC verification of the deployment source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # Do not leave credentials on the runner

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Critical: bind to the github-pages environment so protection rules apply
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
