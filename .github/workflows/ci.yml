name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate index.html
        run: |
          cat > .htmlvalidate.json << 'EOF'
          {
            "extends": ["html-validate:recommended"],
            "rules": {
              "no-inline-style": "off",
              "prefer-native-element": "off",
              "element-permitted-content": "off",
              "no-raw-characters": "off",
              "script-element-content-type": "off",
              "attr-quotes": "off",
              "void-style": "off",
              "no-trailing-whitespace": "off",
              "require-sri": "off"
            }
          }
          EOF
          html-validate index.html || true

      - name: Basic file checks
        run: |
          test -f index.html && echo "index.html present"
          test -f README.md && echo "README.md present"
          ls -lh index.html README.md

      - name: Syntax check (map app markers)
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const checks = [
              ['maplibre-gl', html.includes('maplibre-gl')],
              ['map container', html.includes('id=\"map\"') || html.includes(\"id='map'\")],
              ['camera tiles', html.includes('tiles.dontgetflocked.com')],
              ['heatmap or points', html.includes('heatmap') || html.includes('circle')],
            ];
            let ok = true;
            for (const [name, pass] of checks) {
              console.log((pass ? 'OK' : 'MISSING') + ' - ' + name);
              if (!pass) ok = false;
            }
            if (!ok) process.exit(1);
            console.log('Critical map pieces present');
          "
